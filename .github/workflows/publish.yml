name: Publish PhoneDex CLI to PyPI

on:
  push:
    tags:
      - 'v[0-9]*'
    branches:
      - 'release/v[0-9]*'

permissions:
  contents: read

jobs:
  build:
    name: Test and build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify release reference matches package version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          ref = os.environ["GITHUB_REF"]
          expected = (f"refs/tags/v{version}", f"refs/heads/release/v{version}")
          if ref not in expected:
              raise SystemExit(f"Ref {ref!r} does not match package version {version!r}")
          print("Publishing version:", version)
          PY
      - name: Install build and test tools
        run: python -m pip install --upgrade build twine pytest .
      - name: Run offline tests
        run: python -m pytest -q
      - name: Check executable
        run: phonedex-cli --version
      - name: Build source and wheel distributions
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  tag:
    name: Create version tag for branch-triggered release
    if: startsWith(github.ref, 'refs/heads/release/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create annotated release reference without PAT
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#release/}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${version}" -f sha="${GITHUB_SHA}"

  publish:
    name: Upload verified release to PyPI
    needs: [build, tag]
    if: ${{ always() && needs.build.result == 'success' && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI with OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
