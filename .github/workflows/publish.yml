name: Publish PhoneDex CLI to PyPI

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  build:
    name: Test and build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify tag matches package version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag!r} does not match package version {version!r}")
          print("Publishing version:", version)
          PY
      - name: Install build and test tools
        run: python -m pip install --upgrade build twine pytest .
      - name: Run offline tests
        run: python -m pytest -q
      - name: Check executable
        run: phonedex-cli --version
      - name: Build source and wheel distributions
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload verified release to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI with OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
